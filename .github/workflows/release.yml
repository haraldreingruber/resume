name: Release

# Push a tag like `v0.1.0` to test and build the native apps (via the shared
# native.yml, same as CI) and attach them, each bundled with the PDF, plus the
# PDF itself and the development builds for phones (mobile.yml: an Android
# APK and an iOS Simulator app) to a GitHub Release.
# The binaries are unsigned, so Windows SmartScreen and macOS Gatekeeper will
# warn on first launch.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native
    uses: ./.github/workflows/native.yml

  mobile:
    name: Mobile
    uses: ./.github/workflows/mobile.yml
    secrets: inherit

  latex:
    name: PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: xu-cheng/latex-action@v4
        with:
          working_directory: latex
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -jobname=Harald_Reingruber_resume
      # Uploaded as-is (no zip wrapper); the artifact is named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: latex/Harald_Reingruber_resume.pdf
          archive: false

  release:
    name: GitHub Release
    needs: [native, mobile, latex]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # All artifacts here were uploaded without a zip wrapper; skip-decompress
      # keeps the Windows .zip from being extracted, so it's attached as-is.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          skip-decompress: true
      # The app's "PDF" button opens the PDF next to the executable (falling
      # back to the hosted copy), so ship it inside each archive too. The PDF
      # also stays a separate release asset.
      - name: Add the PDF to the native archives
        working-directory: artifacts
        run: |
          pdf=Harald_Reingruber_resume.pdf
          for archive in resume-3d-windows-*.zip; do
            zip -j "$archive" "$pdf"
          done
          for archive in resume-3d-*.tar.gz; do
            gunzip "$archive"
            tar -rf "${archive%.gz}" "$pdf"
            gzip "${archive%.gz}"
          done
          ls -l
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
