name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; runs on main queue instead, so a newer
# push never cancels a Pages deploy that is already in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p resume-3d --target wasm32-unknown-unknown -- -D warnings
      - name: Generated files are up to date with content/resume.yaml
        run: cargo gen check

  dependencies:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A new security advisory can appear any day, unrelated to a change: it's
    # reported (the job's annotations) but doesn't fail the build.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  native:
    name: Native
    uses: ./.github/workflows/native.yml
    with:
      screenshots: true

  mobile:
    name: Mobile
    uses: ./.github/workflows/mobile.yml
    with:
      smoke_test: true
    secrets: inherit

  latex:
    name: PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/latex-action@v4
        with:
          working_directory: latex
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -jobname=Harald_Reingruber_resume
      # Uploaded as-is (no zip wrapper); the artifact is named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: latex/Harald_Reingruber_resume.pdf
          archive: false

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: Build
        working-directory: 3d-resume
        run: trunk build --release
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: 3d-resume/dist
      # Baseline for the size report: the newest sizes saved by a main
      # build (runs can read caches of the default branch).
      - name: Restore the size baseline
        uses: actions/cache/restore@v6
        with:
          path: web-size-baseline.txt
          key: web-size-${{ github.sha }}
          restore-keys: web-size-
      - name: Report bundle sizes and check the budget
        run: bash .github/scripts/web-size.sh 3d-resume/dist web-size-baseline.txt web-size.txt
      - name: Keep these sizes as the new baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp web-size.txt web-size-baseline.txt
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: web-size-baseline.txt
          key: web-size-${{ github.sha }}

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, latex, web]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: site
      - uses: actions/download-artifact@v8
        with:
          name: Harald_Reingruber_resume.pdf
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
