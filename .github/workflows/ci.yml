name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; runs on master queue instead, so a newer
# push never cancels a Pages deploy that is already in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p resume-3d --target wasm32-unknown-unknown -- -D warnings
      - name: Generated files are up to date with content/resume.yaml
        run: cargo gen check

  native:
    name: Native
    uses: ./.github/workflows/native.yml

  latex:
    name: PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: xu-cheng/latex-action@v4
        with:
          working_directory: latex
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -jobname=Harald_Reingruber_resume
      # Uploaded as-is (no zip wrapper); the artifact is named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: latex/Harald_Reingruber_resume.pdf
          archive: false

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: Build
        working-directory: 3d-resume
        run: trunk build --release
      - name: Report bundle sizes
        working-directory: 3d-resume/dist
        run: |
          {
            echo "### Web bundle"
            echo "| File | Raw | gzip | brotli |"
            echo "| --- | ---: | ---: | ---: |"
            for f in *.wasm *.js; do
              echo "| $f | $(stat -c%s "$f") | $(gzip -9c "$f" | wc -c) | $(brotli -c "$f" | wc -c) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: 3d-resume/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [rust, latex, web]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: site
      - uses: actions/download-artifact@v8
        with:
          name: Harald_Reingruber_resume.pdf
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
