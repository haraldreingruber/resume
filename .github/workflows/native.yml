name: Native

# Reusable: tests the workspace and builds the native 3D resume (release
# profile) on Linux, Windows and macOS, uploading one archive per platform.
# Called by ci.yml (every PR and push to main) and release.yml (tags), so
# releases ship exactly what CI tested.
on:
  workflow_call:
    inputs:
      screenshots:
        description: Render every station headlessly on Linux (Mesa's software Vulkan) and upload the PNGs.
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            archive: resume-3d-linux-x86_64.tar.gz
          - name: Windows x86_64
            os: windows-latest
            archive: resume-3d-windows-x86_64.zip
          - name: macOS arm64
            os: macos-latest
            archive: resume-3d-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build -p resume-3d --release
      # The release binary renders offscreen, so no display is needed; the
      # run fails if a station comes out blank.
      - name: Screenshots (software Vulkan)
        if: inputs.screenshots && runner.os == 'Linux'
        env:
          WGPU_ADAPTER_NAME: llvmpipe
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libvulkan1 mesa-vulkan-drivers
          target/release/resume-3d --screenshots screenshots
          # A portrait phone (390x844 at 3x): the compact layout.
          target/release/resume-3d --screenshots screenshots/phone --size 1170x2532 --scale 3 --touch
          # How long the headless start took, phase by phase (software Vulkan,
          # so slower than a real GPU; for spotting regressions).
          {
            echo "### Startup (headless, software Vulkan)"
            echo
            cat screenshots/startup.md
          } >> "$GITHUB_STEP_SUMMARY"
      # Also when a station came out blank, to see what went wrong.
      - name: Upload screenshots
        if: ${{ !cancelled() && inputs.screenshots && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "Binary size (${{ matrix.name }}): $((Get-Item target/release/resume-3d.exe).Length) bytes" >> $env:GITHUB_STEP_SUMMARY
          Compress-Archive -Path target/release/resume-3d.exe -DestinationPath ${{ matrix.archive }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "Binary size (${{ matrix.name }}): $(wc -c < target/release/resume-3d) bytes" >> "$GITHUB_STEP_SUMMARY"
          tar -czf ${{ matrix.archive }} -C target/release resume-3d
      # Uploaded as-is: GitHub would otherwise wrap the archive in another zip
      # (and zipping drops the executable bit, which the tar.gz keeps). The
      # artifact is named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.archive }}
          archive: false
