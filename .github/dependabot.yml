# Weekly dependency updates: Cargo crates and GitHub Actions. Minor and patch
# updates arrive together, one PR per ecosystem; major updates (e.g. a new
# wgpu or winit) come as their own PRs, since they usually need code changes.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # build.rs hands nalgebra types to fdsm (the MSDF generator), so both
      # must use the same nalgebra; fdsm 0.8 uses 0.34. Lift this once fdsm
      # moves on.
      - dependency-name: nalgebra
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
