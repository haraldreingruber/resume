[package]
name = "resume-gen"
description = "Generates LaTeX data, README.md, plain HTML and the JSON schema from content/resume.yaml"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
minijinja = "2.24.0"
resume-model = { workspace = true, features = ["load"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
