[package]
name = "resume-model"
description = "Resume content model: normalized domain types, plus loading/validation of content/resume.yaml (feature `load`)"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
# Parse, validate and normalize the YAML source. Only needed by generators and
# build scripts; the runtime (e.g. the wasm app) only needs the domain types.
load = ["dep:serde-saphyr", "dep:pulldown-cmark", "dep:schemars"]

[dependencies]
pulldown-cmark = { version = "0.13.4", optional = true, default-features = false }
schemars = { version = "1.2.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.3.0", optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
