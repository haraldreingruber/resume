# yaml-language-server: $schema=./resume.schema.json
#
# Single source of truth for the resume. Follows the JSON Resume schema
# (https://jsonresume.org/schema) plus `x-` extension fields.
#
# After editing run `cargo gen all` to regenerate the LaTeX data, README.md and
# the plain HTML page (`cargo gen check` verifies they are up to date).
#
# Text conventions:
# - Write plain Unicode, never LaTeX (`&`, `#`, `%`, `ò` are fine as-is).
# - `--` becomes an en dash, `---` an em dash.
# - Prose fields (summary, highlights, description) accept inline Markdown:
#   **bold**, *emphasis*, [links](https://…), `code`, and &nbsp; for a
#   non-breaking space. "Quotes" and apostrophes become typographic.
#
# Extension fields:
# - x-id: stable id per entry (kebab-case, unique).
# - x-place: id from x-places below; x-remote: true, or a scope like
#   Worldwide ("Remote (Worldwide)").
# - x-skills: skills used, as exact keywords from the skills section.
# - x-color: optional accent color (#RRGGBB) for the 3D resume.
# - x-short: optional short name for the 3D skill map (defaults to the
#   company name, or the project type).

