[package]
name = "resume-3d"
description = "WebGPU 3D resume (wgpu + winit), runs natively and in the browser"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.33.10"
log = "0.4.34"
png = { version = "0.18.1", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
resume-model.workspace = true
web-time = "1.1.0"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"
pollster = "1.0.1"
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "metal", "vulkan", "parking_lot"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location"] }
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "web"] }

[build-dependencies]
fdsm = "0.8.0"
fdsm-ttf-parser = "0.2.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
nalgebra = "0.34.1"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
resume-model = { workspace = true, features = ["load"] }
ttf-parser = "0.25.1"
